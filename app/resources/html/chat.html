<!-- 听书知识库 - 查询演示页面 -->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <title>听书知识库</title>
  <style>
    :root{
      --bg:#f3f5f7;
      --panel:#ffffff;
      --text:#1f2d3d;
      --muted:#7a869a;
      --brand:#e6a23c;
      --brand2:#f56c6c;
      --bubble-user:#e6a23c;
      --bubble-bot:#ffffff;
      --border:#e6e9ef;
      --shadow:0 10px 30px rgba(31,45,61,.12);
    }
    *{box-sizing:border-box}
    body{
      margin:0;
      font-family: "Segoe UI", "Microsoft YaHei", system-ui, -apple-system, Arial, sans-serif;
      background: radial-gradient(1200px 600px at 20% 0%, rgba(230,162,60,.18), transparent 60%),
                  radial-gradient(1000px 500px at 90% 10%, rgba(245,108,108,.18), transparent 55%),
                  var(--bg);
      color:var(--text);
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      padding:18px;
    }
    .app{
      width:100%;
      max-width:980px;
      height:min(820px, 92vh);
      background:var(--panel);
      border:1px solid var(--border);
      border-radius:16px;
      box-shadow:var(--shadow);
      overflow:hidden;
      display:flex;
      flex-direction:column;
    }
    .topbar{
      display:flex;
      align-items:center;
      gap:12px;
      padding:14px 18px;
      border-bottom:1px solid var(--border);
      background:linear-gradient(90deg, rgba(230,162,60,.10), rgba(245,108,108,.10));
    }
    .brand{
      display:flex;
      align-items:center;
      gap:10px;
      min-width:240px;
    }
    .logo{
      width:36px;height:36px;border-radius:10px;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      box-shadow:0 8px 18px rgba(230,162,60,.25);
    }
    .title{
      display:flex;
      flex-direction:column;
      line-height:1.1;
    }
    .title strong{font-size:14px}
    .title span{font-size:12px;color:var(--muted);margin-top:3px}
    .top-actions{
      margin-left:auto;
      display:flex;
      gap:10px;
      align-items:center;
    }
    .pill{
      font-size:12px;
      color:var(--muted);
      border:1px solid var(--border);
      padding:6px 10px;
      border-radius:999px;
      background:#fff;
    }
    .btn{
      border:none;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
      color:#fff;
      padding:8px 12px;
      border-radius:10px;
      font-size:12px;
      cursor:pointer;
    }
    .btn:disabled{opacity:.6;cursor:not-allowed}

    .chat{
      flex:1;
      overflow:auto;
      padding:16px 14px 10px;
      background:linear-gradient(180deg, rgba(230,162,60,.05), transparent 40%),
                 linear-gradient(0deg, rgba(245,108,108,.05), transparent 45%);
    }
    .dayline{
      text-align:center;
      color:var(--muted);
      font-size:12px;
      margin:6px 0 14px;
    }
    .msg{
      display:flex;
      gap:10px;
      margin:10px 0;
      align-items:flex-end;
    }
    .msg.user{justify-content:flex-end}
    .msg > div:not(.avatar){flex:1;min-width:0;}
    .msg.user > div:not(.avatar){display:flex;flex-direction:column;align-items:flex-end;}
    .avatar{
      width:34px;height:34px;border-radius:10px;
      background:#e9eef7;
      display:flex;align-items:center;justify-content:center;
      font-size:14px;
      color:#3b4a5a;
      flex:0 0 auto;
    }
    .avatar.bot{background:linear-gradient(135deg, rgba(230,162,60,.18), rgba(245,108,108,.18))}
    .bubble{
      max-width:min(720px, 76%);
      display:inline-block;
      border-radius:14px;
      padding:10px 12px;
      border:1px solid var(--border);
      background:var(--bubble-bot);
      position:relative;
      line-height:1.55;
      font-size:14px;
      white-space:pre-wrap;
      overflow-wrap: break-word;
    }
    .msg.user .bubble{
      background:var(--bubble-user);
      color:#fff;
      border-color:transparent;
    }
    .meta{
      font-size:11px;
      color:var(--muted);
      margin-top:6px;
    }
    .msg.user .meta{color:rgba(255,255,255,.85)}

    /* 听书卡片样式 */
    .book-card{
      border:1px solid var(--border);
      border-radius:12px;
      padding:12px;
      margin:8px 0;
      background:#fff;
      box-shadow:0 2px 8px rgba(0,0,0,.04);
    }
    .book-card h4{
      margin:0 0 6px;
      color:var(--text);
      font-size:15px;
    }
    .book-card .meta-row{
      font-size:12px;
      color:var(--muted);
      margin:2px 0;
    }
    .book-card .reason{
      margin-top:6px;
      font-size:13px;
      color:#4a5568;
    }

    details.progress{
      margin-top:8px;
      border:1px dashed rgba(122,134,154,.45);
      border-radius:12px;
      padding:8px 10px;
      background:rgba(122,134,154,.06);
    }
    details.progress summary{
      cursor:pointer;
      user-select:none;
      color:var(--muted);
      font-size:12px;
    }
    .progress ul{margin:8px 0 0 18px;padding:0}
    .progress li{margin:4px 0;font-size:12px;color:#56657a}

    .answer-images{
      margin-top:10px;
      display:flex;
      flex-direction:column;
      gap:10px;
    }
    .answer-images img{
      display: block;
      max-width: min(100%, 600px);
      max-height: 600px;
      width: auto;
      height: auto;
      border-radius:12px;
      border:1px solid var(--border);
      box-shadow:0 10px 24px rgba(31,45,61,.10);
      background:#fff;
    }

    .typing{
      display:inline-flex;gap:6px;align-items:center;
    }
    .dot{
      width:7px;height:7px;border-radius:50%;
      background:#9aa6b2;
      animation:bounce 1.2s infinite ease-in-out;
    }
    .dot:nth-child(2){animation-delay:.15s}
    .dot:nth-child(3){animation-delay:.3s}
    @keyframes bounce{
      0%,80%,100%{transform:translateY(0);opacity:.6}
      40%{transform:translateY(-5px);opacity:1}
    }

    .composer{
      border-top:1px solid var(--border);
      padding:12px 14px;
      display:flex;
      gap:10px;
      align-items:flex-end;
      background:#fff;
    }
    textarea{
      flex:1;
      resize:none;
      min-height:44px;
      max-height:140px;
      padding:10px 12px;
      border-radius:12px;
      border:1px solid var(--border);
      outline:none;
      font-size:14px;
      line-height:1.5;
    }
    textarea:focus{border-color:rgba(230,162,60,.6); box-shadow:0 0 0 3px rgba(230,162,60,.12)}
    .send{
      width:88px;
      height:44px;
      border:none;
      border-radius:12px;
      cursor:pointer;
      font-size:14px;
      color:#fff;
      background:linear-gradient(135deg, var(--brand), var(--brand2));
    }
    .send:disabled{opacity:.6;cursor:not-allowed}
    .hint{
      padding:0 14px 12px;
      color:var(--muted);
      font-size:12px;
      background:#fff;
    }
    .kbd{
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      border:1px solid var(--border);
      padding:1px 6px;
      border-radius:6px;
      background:#f7f9fc;
      color:#3b4a5a;
    }
  </style>
</head>
<body>
  <div class="app">
    <div class="topbar">
      <div class="brand">
        <div class="logo"></div>
        <div class="title">
          <strong>听书知识库</strong>
          <span id="subTitle">在线 · 智能推荐 · 书籍详情 · 听书笔记</span>
        </div>
      </div>
      <div class="top-actions">
        <label style="font-size:12px;display:flex;align-items:center;gap:4px;cursor:pointer;user-select:none;color:var(--muted);margin-right:10px;">
          <input type="checkbox" id="streamToggle" checked> 流式输出
        </label>
        <span class="pill" id="apiPill">API: 未连接</span>
        <button class="btn" id="btnClear">清空对话</button>
      </div>
    </div>

    <div class="chat" id="chat">
      <div class="dayline">今天</div>
      <div class="msg bot">
        <div class="avatar bot">听书智库</div>
        <div>
          <div class="bubble">你好，我是听书知识库助手。你可以问我推荐书籍、查询详情、检索笔记或知识问答。</div>
          <div class="meta">提示：可以问"推荐几本科幻小说"或"《三体》的详细介绍"</div>
        </div>
      </div>
    </div>

    <div class="composer">
      <textarea id="input" placeholder="请输入问题（Enter 发送，Shift+Enter 换行）"></textarea>
      <button class="send" id="send">发送</button>
    </div>
    <div class="hint">快捷键：<span class="kbd">Enter</span> 发送，<span class="kbd">Shift</span>+<span class="kbd">Enter</span> 换行</div>
  </div>

  <script>
    const API_BASE = location.origin.startsWith('http') ? location.origin : 'http://127.0.0.1:8002';
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    const apiPill = document.getElementById('apiPill');
    const btnClear = document.getElementById('btnClear');
    const streamToggle = document.getElementById('streamToggle');

    let sessionId = localStorage.getItem('tingbook_session_id');
    if (!sessionId) {
      sessionId = 'sess-' + Math.random().toString(36).slice(2) + Date.now().toString(36);
      localStorage.setItem('tingbook_session_id', sessionId);
    }

    function scrollToBottom(){chatEl.scrollTop = chatEl.scrollHeight;}
    function nowTime(){
      const d = new Date();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function formatTime(ts){
      if(!ts) return nowTime();
      const d = new Date(Number(ts) * 1000);
      if(Number.isNaN(d.getTime())) return nowTime();
      return d.toLocaleTimeString('zh-CN', {hour:'2-digit', minute:'2-digit'});
    }
    function escapeHtml(str){
      return String(str)
        .replaceAll('&','&amp;')
        .replaceAll('<','&lt;')
        .replaceAll('>','&gt;')
        .replaceAll('"','&quot;')
        .replaceAll("'","&#039;");
    }

    function addUserMsg(text){
      const html = `
        <div class="msg user">
          <div>
            <div class="bubble">${escapeHtml(text)}</div>
            <div class="meta">${nowTime()}</div>
          </div>
          <div class="avatar">我</div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
    }

    function addBotSkeleton(){
      const id = 'bot-' + Math.random().toString(36).slice(2);
      const html = `
        <div class="msg bot" id="${id}">
          <div class="avatar bot">听书智库</div>
          <div style="min-width: 180px;">
            <div class="bubble">
              <span class="typing"><span class="dot"></span><span class="dot"></span><span class="dot"></span></span>
              <details class="progress" open>
                <summary>阶段进度（等待中）</summary>
                <ul></ul>
              </details>
            </div>
            <div class="meta">${nowTime()}</div>
          </div>
        </div>
      `;
      chatEl.insertAdjacentHTML('beforeend', html);
      scrollToBottom();
      return document.getElementById(id);
    }

    function renderProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl.querySelector('details.progress');
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const running = Array.isArray(runningList) ? runningList : [];
      const totalDone = done.length;
      const totalRun = running.length;

      const statusMap = {'processing': '处理中', 'completed': '已完成', 'failed': '失败', 'pending': '等待中'};
      const displayStatus = statusMap[status] || status || 'unknown';

      summary.textContent = `阶段进度（已完成${totalDone}，进行中${totalRun}，状态：${displayStatus}）`;

      const lines = [...done.map(x => `✓ ${x}`), ...running.map(x => `⟳ ${x}`)];
      ul.innerHTML = '';
      if(lines.length === 0){
        ul.insertAdjacentHTML('beforeend', '<li>暂无进度</li>');
      }else{
        for(const line of lines){
          ul.insertAdjacentHTML('beforeend', `<li>${escapeHtml(line)}</li>`);
        }
      }
    }

    function renderBookCard(container, book){
      const card = document.createElement('div');
      card.className = 'book-card';
      card.innerHTML = `
        <h4>《${escapeHtml(book.book_title || '')}》</h4>
        <div class="meta-row">作者：${escapeHtml(book.author || '')}</div>
        <div class="meta-row">类别：${escapeHtml(book.category || '')}</div>
        <div class="reason">${escapeHtml(book.reason || '')}</div>
      `;
      container.appendChild(card);
    }

    function finalizeBotAnswer(botMsgEl, answer, error, extraData){
      const bubble = botMsgEl.querySelector('.bubble');
      const progress = botMsgEl.querySelector('details.progress');
      const err = (error || '').trim();

      if(progress) progress.remove();

      bubble.textContent = '';

      if(err){
        const errEl = document.createElement('div');
        errEl.className = 'answer';
        errEl.textContent = `抱歉，本次处理失败：\n${err}`;
        bubble.appendChild(errEl);
        return;
      }

      const answerEl = document.createElement('div');
      answerEl.className = 'answer';
      bubble.appendChild(answerEl);

      // 渲染推荐卡片
      if(extraData && extraData.recommendations && extraData.recommendations.length > 0){
        const recContainer = document.createElement('div');
        recContainer.style.marginTop = '10px';
        extraData.recommendations.forEach(book => {
          renderBookCard(recContainer, book);
        });
        bubble.appendChild(recContainer);
      }

      // 渲染详情
      if(extraData && extraData.book_detail && Object.keys(extraData.book_detail).length > 0){
        const detail = extraData.book_detail;
        const detailEl = document.createElement('div');
        detailEl.className = 'book-card';
        detailEl.style.marginTop = '10px';
        detailEl.innerHTML = `
          <h4>《${escapeHtml(detail.book_title || '')}》</h4>
          <div class="meta-row">作者：${escapeHtml(detail.author || '')}</div>
          <div class="meta-row">类别：${escapeHtml(detail.category || '')}</div>
          <div class="meta-row">时长：${escapeHtml(detail.duration || '未知')}</div>
          <div class="meta-row">内容类型：${escapeHtml((detail.content_types || []).join(', ') || '')}</div>
          ${detail.highlights ? `<div class="reason">亮点：${escapeHtml(detail.highlights)}</div>` : ''}
          ${detail.faq ? `<div class="reason">常见问题：${escapeHtml(detail.faq)}</div>` : ''}
        `;
        bubble.appendChild(detailEl);
      }

      // 渲染文本答案
      if(answer){
        const textEl = document.createElement('div');
        textEl.style.marginTop = '8px';
        textEl.textContent = answer;
        bubble.appendChild(textEl);
      }
    }

    async function onSend(){
      const text = inputEl.value.trim();
      if (!text) return;
      inputEl.value = '';
      addUserMsg(text);
      const botId = addBotSkeleton();
      sendBtn.disabled = true;

      try {
        const isStream = streamToggle.checked;
        const res = await fetch(`${API_BASE}/query`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ query: text, session_id: sessionId, is_stream: isStream }),
        });
        if (!res.ok) throw new Error(await res.text() || '请求失败');
        const data = await res.json();

        const botEl = document.getElementById(botId);
        updateProgress(botEl, [], [], 'pending');

        if (!isStream) {
          updateProgress(botEl, data.done_list || [], [], 'completed');
          finalizeBotAnswer(botEl, data.answer, null, data);
          sendBtn.disabled = false;
          return;
        }

        const sessId = data.session_id;
        const es = new EventSource(`${API_BASE}/stream/${sessId}`);

        es.addEventListener('progress', (e) => {
          try {
            const d = JSON.parse(e.data);
            updateProgress(document.getElementById(botId), d.done_list, d.running_list, d.status);
            if (d.status === 'completed') sendBtn.disabled = false;
          } catch (_) {}
        });

        es.addEventListener('delta', (e) => {
          try {
            const d = JSON.parse(e.data);
            const answerDiv = document.getElementById(botId)?.querySelector('.answer');
            if (answerDiv && d.delta) {
              const txt = answerDiv.textContent + d.delta;
              answerDiv.textContent = txt;
              scrollToBottom();
            }
          } catch (_) {}
        });

        es.addEventListener('final', (e) => {
          try {
            const d = JSON.parse(e.data);
            finalizeBotAnswer(document.getElementById(botId), d.answer || '', null, d);
          } catch (_) {}
          es.close();
          sendBtn.disabled = false;
        });

        es.addEventListener('error', (e) => {
          let errMsg = 'SSE 连接中断';
          try {
            if (e.data) {
              const parsed = JSON.parse(e.data);
              if (parsed.error) errMsg = parsed.error;
            }
          } catch (_) {}
          finalizeBotAnswer(document.getElementById(botId), '', errMsg, {});
          es.close();
          sendBtn.disabled = false;
        });
      } catch (err) {
        finalizeBotAnswer(document.getElementById(botId), '', err.message, {});
        sendBtn.disabled = false;
      }
    }

    function updateProgress(botMsgEl, doneList, runningList, status){
      const details = botMsgEl?.querySelector('details.progress');
      if(!details) return;
      const summary = details.querySelector('summary');
      const ul = details.querySelector('ul');
      const done = Array.isArray(doneList) ? doneList : [];
      const run = Array.isArray(runningList) ? runningList : [];
      summary.textContent = `阶段进度（已完成${done.length}，进行中${run.length}）`;
      ul.innerHTML = '';
      done.forEach(x => { const li = document.createElement('li'); li.className = 'done'; li.textContent = '✓ ' + x; ul.appendChild(li); });
      run.forEach(x => { const li = document.createElement('li'); li.className = 'running'; li.textContent = '⟳ ' + x; ul.appendChild(li); });
    }

    sendBtn.addEventListener('click', onSend);
    inputEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSend(); }
    });
    btnClear.addEventListener('click', async () => {
      if (!confirm('确定清空对话历史？')) return;
      try {
        await fetch(`${API_BASE}/history/${sessionId}`, { method: 'DELETE' });
      } catch (_) {}
      chatEl.innerHTML = '<div class="dayline">今天</div>';
    });

    async function checkApi(){
      try {
        const r = await fetch(`${API_BASE}/health`);
        apiPill.textContent = r.ok ? 'API: 已连接' : 'API: 异常';
        apiPill.style.color = r.ok ? '#2ecc71' : '#e74c3c';
      } catch {
        apiPill.textContent = 'API: 未连接';
        apiPill.style.color = '#e74c3c';
      }
    }
    checkApi();
    setInterval(checkApi, 5000);
  </script>
</body>
</html>
